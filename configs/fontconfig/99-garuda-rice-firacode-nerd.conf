<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Old Nerd Fonts v2 "Complete" patches lack MDI glyphs (U+F0000+) used by fastfetch. -->
  <selectfont>
    <rejectfont>
      <glob>*/Fira Code *Nerd Font Complete*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
